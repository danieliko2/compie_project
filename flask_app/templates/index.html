<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compie Reviews</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 650px; 
            margin: 40px auto; 
            padding: 0 20px; 
            color: #333;
            background-color: #f9f9f9;
        }
        .container {
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        h1, h2 { color: #232f3e; margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input[type="text"], textarea { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            font-size: 14px;
        }
        button { 
            background-color: #ff9900; 
            color: white; 
            padding: 10px 18px; 
            border: none; 
            font-weight: bold;
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
        }
        button:hover { background-color: #e68a00; }
        .review-card { 
            border: 1px solid #e2e8f0; 
            padding: 16px; 
            margin-bottom: 12px; 
            border-radius: 6px; 
            background: #ffffff; 
        }
        .reviewer { font-weight: bold; color: #1a202c; }
        .meta { font-size: 0.75rem; color: #718096; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Reviews</h1>
        
        <form action="/review" method="POST">
            <div class="form-group">
                <label for="reviewer_name">Name</label>
                <input type="text" id="reviewer_name" name="reviewer_name" required placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="content">Review</label>
                <textarea id="content" name="content" rows="3" required placeholder="Write your review..."></textarea>
            </div>
            <button type="submit">Submit Review</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #e2e8f0;">

        <h2>All Reviews</h2>
        {% if reviews %}
            {% for r in reviews %}
                <div class="review-card">
                    <div class="reviewer">{{ r.reviewer_name }}</div>
                    <p style="margin: 8px 0 0 0;">{{ r.content }}</p>
                    <div class="meta">Posted at: {{ r.created_at }}</div>
                </div>
            {% endfor %}
        {% else %}
            <p style="color: #718096;">No reviews yet. Be the first to leave one!</p>
        {% endif %}

        {% if is_logged_in %}
            <a href="/logout">Logout</a>
            <!-- Inside your review loop -->
            <form action="/review/delete/{{ review.review_id }}" method="POST" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        {% else %}
            <a href="/login">Admin Login</a>
        {% endif %}
    </div>

</body>
</html>
