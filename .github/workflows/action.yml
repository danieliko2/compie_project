name: Compie CI/CD

on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::367425865577:role/GitHubActionsRole
          aws-region: us-east-1
          retry-max-attempts: 1  # Stop loop and print actual error immediately

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/daniel_dev/compie_app:${{ github.sha }} -t ${{ steps.login-ecr.outputs.registry }}/daniel_dev/compie_app:latest .

      # - name: Fetch SSM Parameters and Run Pytest
      #   run: |
      #     # 1. Fetch parameters (with decryption for SecureString password)
      #     AWS_REGION=$(aws ssm get-parameter --name "/production/compie_app/AWS_REGION" --query "Parameter.Value" --output text)
      #     DYNAMODB_TABLE=$(aws ssm get-parameter --name "/production/compie_app/DYNAMODB_TABLE" --query "Parameter.Value" --output text)
      #     APP_USERNAME=$(aws ssm get-parameter --name "/production/compie_app/APP_USERNAME" --query "Parameter.Value" --output text)
      #     APP_PASSWORD=$(aws ssm get-parameter --name "/production/compie_app/APP_PASSWORD" --with-decryption --query "Parameter.Value" --output text)

      #     # 2. Pass fetched parameters into the container run step
      #     # ('python -m pytest' automatically adds /app to sys.path)
      #     docker run --rm \
      #       -e AWS_REGION="$AWS_REGION" \
      #       -e DYNAMODB_TABLE="$DYNAMODB_TABLE" \
      #       -e APP_USERNAME="$APP_USERNAME" \
      #       -e APP_PASSWORD="$APP_PASSWORD" \
      #       ${{ steps.login-ecr.outputs.registry }}/daniel_dev/compie_app:${{ github.sha }} python -m pytest -v

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/daniel_dev/compie_app:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/daniel_dev/compie_app:latest

      - name: Deploy (Trigger ASG Instance Refresh)
        run: |
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'production-asg-')].AutoScalingGroupName | [0]" \
            --output text)
          
          echo "Found ASG: $ASG_NAME"
          
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50}'